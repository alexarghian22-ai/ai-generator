<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 i { color: #6366f1; }

        p.subtitle {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #d1d5db;
        }

        textarea {
            width: 100%;
            height: 130px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 14px;
            color: white;
            font-size: 15px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus { border-color: #6366f1; }

        button.generate-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-decoration: none;
        }

        button.generate-btn:hover { opacity: 0.9; }
        button.generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-text {
            margin-top: 14px;
            font-size: 13px;
            color: #9ca3af;
            text-align: center;
            min-height: 18px;
        }

        .results-container {
            margin-top: 30px;
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .results-container.active { display: flex; }

        .result-card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .scenes-preview {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            color: #9ca3af;
            text-align: left;
        }

        .scenes-preview span { color: #d1d5db; }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><i class="fa-solid fa-wand-magic-sparkles"></i> AI Video Generator</h1>
        <p class="subtitle">Scrie ideea ta, AI-ul construiește scenariul, iar Shotstack randează videoclipul.</p>

        <div class="input-group">
            <label>Ideea ta</label>
            <textarea id="sourceInput" placeholder="Ex: Promovează cafeneaua mea de cartier, atmosferă caldă, cafea proaspătă..."></textarea>
        </div>

        <button class="generate-btn" id="generateBtn" onclick="genereazaVideo()">
            <span id="btnText">Generează Video</span>
            <div class="spinner" id="btnSpinner"></div>
        </button>

        <div class="status-text" id="statusText"></div>

        <div class="results-container" id="resultsContainer"></div>
    </div>

    <script>
        async function genereazaVideo() {
            const textUtilizator = document.getElementById('sourceInput').value.trim();
            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            const statusText = document.getElementById('statusText');
            const containerRezultate = document.getElementById('resultsContainer');

            if (!textUtilizator) {
                alert('Te rog introdu o idee mai întâi!');
                return;
            }

            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            containerRezultate.classList.remove('active');
            containerRezultate.innerHTML = '';

            try {
                // Pasul 1: transformăm ideea în scenariu (backend-ul apelează Claude)
                statusText.textContent = 'Se construiește scenariul video...';
                const scriptResponse = await fetch('/api/generate-script', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idea: textUtilizator }),
                });
                const scriptData = await scriptResponse.json();

                if (!scriptResponse.ok) {
                    throw new Error(scriptData.error || 'Eroare la generarea scenariului.');
                }

                const scenes = scriptData.scenes;

                // Afișăm rapid scenele generate, ca preview, cât timp video-ul randează
                containerRezultate.innerHTML = `
                    <div class="result-card">
                        <h3>Scenariu generat</h3>
                        <div class="scenes-preview">
                            ${scenes.map((s, i) => `<div><span>Scena ${i + 1} (${s.duration}s):</span> ${s.text}</div>`).join('')}
                        </div>
                    </div>
                `;
                containerRezultate.classList.add('active');

                // Pasul 2: pornim randarea video pe Shotstack (prin backend-ul nostru)
                statusText.textContent = 'Se pornește randarea video...';
                const renderResponse = await fetch('/api/render-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scenes }),
                });
                const renderData = await renderResponse.json();

                if (!renderResponse.ok) {
                    throw new Error(renderData.error || 'Eroare la pornirea randării.');
                }

                verificaStatusVideo(renderData.renderId);

            } catch (error) {
                console.error('A apărut o eroare:', error);
                statusText.textContent = '';
                alert('Eroare: ' + error.message);
                btn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }

        async function verificaStatusVideo(renderId) {
            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            const statusText = document.getElementById('statusText');
            const containerRezultate = document.getElementById('resultsContainer');

            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/check-status?id=${renderId}`);
                    const data = await response.json();

                    if (data.status === 'done') {
                        clearInterval(interval);
                        statusText.textContent = '';
                        btn.disabled = false;
                        btnText.style.display = 'block';
                        spinner.style.display = 'none';

                        containerRezultate.innerHTML += `
                            <div class="result-card">
                                <h3>Videoclipul tău este gata!</h3>
                                <video width="100%" controls style="margin-top:10px; border-radius:8px;">
                                    <source src="${data.url}" type="video/mp4">
                                    Browserul tău nu suportă elementul video.
                                </video>
                                <br><br>
                                <a href="${data.url}" download="video-ai.mp4" class="generate-btn" style="text-align:center; display:block;">
                                    Descarcă Fișierul MP4
                                </a>
                            </div>
                        `;
                    } else if (data.status === 'failed') {
                        clearInterval(interval);
                        statusText.textContent = '';
                        alert('Randarea a eșuat pe serverul Shotstack.');
                        btn.disabled = false;
                        btnText.style.display = 'block';
                        spinner.style.display = 'none';
                    } else {
                        statusText.textContent = `Se randează... status: ${data.status || 'în procesare'}`;
                    }
                } catch (err) {
                    console.error('Eroare la verificarea statusului:', err);
                }
            }, 5000);
        }
    </script>
</body>
</html>
